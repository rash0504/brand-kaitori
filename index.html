<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>買取情報入力ツール</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #333;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .step { display: none; }
    .step.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: #555; }
    select, input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
    }
    .error-text {
      color: #dc3545;
      font-size: 0.8rem;
      margin-top: 5px;
      display: none;
    }
    .success-text {
      color: #28a745;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 5px;
      display: none;
    }
    .hint-text {
      color: #666;
      font-size: 0.8rem;
      margin-top: 5px;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      color: #fff;
    }
    .btn-primary { background-color: #007bff; }
    .btn-primary:disabled { background-color: #a0cbf7; cursor: not-allowed; }
    .btn-secondary { background-color: #6c757d; }
    .btn-success { background-color: #28a745; transition: 0.2s; }
    
    .copy-row {
      display: flex;
      gap: 10px;
      margin-bottom: 5px;
    }
    .copy-row input {
      flex: 1;
      background-color: #f8f9fa;
      color: #495057;
    }
    .copy-row button {
      flex: 0 0 90px;
      padding: 10px 5px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>買取情報入力</h2>

    <!-- Step 1: 担当者選択 -->
    <div id="step1" class="step active">
      <div class="form-group">
        <label for="staff">担当者</label>
        <select id="staff">
          <option value="松並 欣汰" selected>松並 欣汰</option>
        </select>
      </div>
      <div class="btn-group">
        <button id="next1" class="btn-primary">次へ</button>
      </div>
    </div>

    <!-- Step 2: ID入力 -->
    <div id="step2" class="step">
      <div class="form-group">
        <label for="transactionId">取引ID</label>
        <input type="text" id="transactionId" placeholder="例: 1-123456-1">
        <div id="idError" class="error-text">形式が正しくありません (例: 1-123456-12)</div>
      </div>
      <div class="btn-group">
        <button id="back1" class="btn-secondary">戻る</button>
        <button id="next2" class="btn-primary" disabled>次へ</button>
      </div>
    </div>

    <!-- Step 3: ブランド選択 -->
    <div id="step3" class="step">
      <div class="form-group">
        <label for="brand">ブランド</label>
        <input type="text" id="brand" list="brandList" placeholder="文字を入力して絞り込み">
        <datalist id="brandList"></datalist>
        <div class="hint-text">※リストにないブランドも手入力可能です</div>
      </div>
      <div class="btn-group">
        <button id="back2" class="btn-secondary">戻る</button>
        <button id="next3" class="btn-primary" disabled>次へ</button>
      </div>
    </div>

    <!-- Step 4: 商品名入力 -->
    <div id="step4" class="step">
      <div class="form-group">
        <label for="itemName">商品名</label>
        <input type="text" id="itemName" placeholder="例: Supreme x The Exorcist Flannel Shirt &quot;Black × Blue&quot;">
        <div id="translateMsg" class="success-text"></div>
        <div class="hint-text">※必ず ブランド名 商品名 "カラー" の順にしてください</div>
      </div>
      <div class="btn-group">
        <button id="back3" class="btn-secondary">戻る</button>
        <button id="next4" class="btn-primary" disabled>次へ</button>
      </div>
    </div>

    <!-- Step 5: サイズ入力 -->
    <div id="step5" class="step">
      <div class="form-group">
        <label for="itemSize">サイズ</label>
        <input type="text" id="itemSize" placeholder="例: M, L, 42, US8">
      </div>
      <div class="btn-group">
        <button id="back4" class="btn-secondary">戻る</button>
        <button id="next5" class="btn-primary" disabled>完了してコピー</button>
      </div>
    </div>

    <!-- Step 6: コピー画面（2段階） -->
    <div id="step6" class="step">
      
      <div class="form-group">
        <label>① M列用 (商品名〜ブランド)</label>
        <div class="copy-row">
          <input type="text" id="resultData1" readonly>
          <button id="copyBtn1" class="btn-success">コピー</button>
        </div>
        <div class="hint-text">※スプレッドシートの <b>M列</b> のセルに貼り付けてください。</div>
      </div>

      <div class="form-group" style="margin-top: 25px;">
        <label>② U列用 (サイズ〜担当者)</label>
        <div class="copy-row">
          <input type="text" id="resultData2" readonly>
          <button id="copyBtn2" class="btn-success">コピー</button>
        </div>
        <div class="hint-text">※スプレッドシートの <b>U列</b> のセルに貼り付けてください。</div>
      </div>

      <div class="btn-group" style="margin-top: 30px;">
        <button id="back5" class="btn-secondary">戻る</button>
      </div>
    </div>

  </div>

  <script>
    // --- 初期データ準備 ---
    const rawBrands = [
      "A.PRESSE", "AMI PARIS", "ANCELLM", "AURALEE", "BLACK COMME des GARCONS", "BODE", "CELINE", "COMME des GARCONS HOMME", 
      "COMME des GARCONS HOMME Deux", "COMME des GARCONS HOMME PLUS", "COMME des GARCONS SHIRT", "DIOR", "DRIES VAN NOTEN", 
      "HEUGN", "ISSEY MIYAKE", "JIL SANDER", "JUNYA WATANABE", "LEMAIRE", "LOEWE", "Maison Margiela", "MIU MIU", 
      "MM6 Maison Margiela", "NICENESS", "sacai", "SAINT LAURENT", "T.T", "The Row", "Yohji Yamamoto", "yoke", 
      "©SAINT M××××××", "Acne Studios", "AMIRI", "BALENCIAGA", "BOTTEGA VENETA", "Burberry", "Chrome Hearts", "GUCCI", 
      "LOUIS VUITTON", "Moncler", "OUR LEGACY", "PRADA", "RAF SIMONS", "Rick Owens", "Rick Owens DRKSHDW", "Y-3", "adidas", 
      "ARC’TERYX", "C.P. Company", "CANADA GOOSE", "Cav Empt", "COMOLI", "creek", "DAIWA PIER39", "ENNOY", "everyone", 
      "Goldwin", "graphpaper", "HYKE", "LEVI’S", "LEVI’S Vintage Clothing", "Needles", "patagonia", "Polo Ralph Lauren", 
      "ssstein", "STONE ISLAND", "visvim", "BOUCHERON", "BVLGARI", "Cartier", "Casio", "CHANEL", "DAMIANI", "Hermes", 
      "HUMAN MADE", "Supreme", "Tiffany & Co.", "TOM WOOD", "Van Cleef & Arpels", "Chloe", "DIESEL", "FENDI", "GOYARD", 
      "MARNI", "MCM", "STELLA McCARTNEY", "AUDEMARS PIGUET", "Breitling", "Grand Seiko", "HUBLOT", "IWC", "OMEGA", 
      "ŌTSUKA LŌTEC", "Panerai", "PATEK PHILIPPE", "ROLEX", "TAG Heuer", "TUDOR", "ZENITH", "A BATHING APE", "AIR JORDAN", 
      "BlackEyePatch", "BoTT", "Buffer", "Carhartt", "Carhartt WIP", "CDG", "DENIM TEARS", "F.C.Real Bristol", "FRAGMENT", 
      "GEEKS RULE", "Gentle Monster", "Girls Don’t Cr", "HYSTERIC GLAMOUR", "KENZO", "NEIGHBORHOOD", "Noah", 
      "PLAY COMME des GARCONS", "SEE SEE", "Stussy", "THE NORTH FACE", "THUG CLUB", "UNDERCOVER", "VAULTROOM", "VERDY", 
      "WACKO MARIA", "Wasted Youth", "WIND AND SEA", "WTAPS", "drew house", "ESSENTIALS", "FEAR OF GOD", "KITH", 
      "OFF-WHITE", "PALACE", "PEACEMINUSONE", "PORTER", "Travis Scott Cactus Jack", "YEEZY"
    ];
    const uniqueBrands = [...new Set(rawBrands)].sort((a, b) => a.localeCompare(b, 'en', {sensitivity: 'base'}));
    
    const datalist = document.getElementById('brandList');
    uniqueBrands.forEach(brand => {
      const option = document.createElement('option');
      option.value = brand;
      datalist.appendChild(option);
    });

    // --- 要素の取得 ---
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const step4 = document.getElementById('step4');
    const step5 = document.getElementById('step5');
    const step6 = document.getElementById('step6');

    // --- Step 1 ---
    document.getElementById('next1').addEventListener('click', () => {
      step1.classList.remove('active');
      step2.classList.add('active');
    });

    // --- Step 2 (ID) ---
    const transactionId = document.getElementById('transactionId');
    const next2Btn = document.getElementById('next2');
    
    const validateStep2 = () => {
      const idPattern = /^\d{1,2}-\d+-\d{1,2}$/;
      const isIdValid = idPattern.test(transactionId.value.trim());
      document.getElementById('idError').style.display = (transactionId.value !== "" && !isIdValid) ? 'block' : 'none';
      next2Btn.disabled = !isIdValid;
    };
    transactionId.addEventListener('input', validateStep2);

    document.getElementById('back1').addEventListener('click', () => {
      step2.classList.remove('active');
      step1.classList.add('active');
    });
    next2Btn.addEventListener('click', () => {
      step2.classList.remove('active');
      step3.classList.add('active');
    });

    // --- Step 3 (ブランド) ---
    const brandInput = document.getElementById('brand');
    const next3Btn = document.getElementById('next3');
    brandInput.addEventListener('input', () => {
      next3Btn.disabled = brandInput.value.trim() === "";
    });

    document.getElementById('back2').addEventListener('click', () => {
      step3.classList.remove('active');
      step2.classList.add('active');
    });
    next3Btn.addEventListener('click', () => {
      step3.classList.remove('active');
      step4.classList.add('active');
      
      const selectedBrand = brandInput.value.trim();
      const itemNameInput = document.getElementById('itemName');
      
      if (itemNameInput.value === "") {
        itemNameInput.value = selectedBrand + " ";
      }
      itemNameInput.placeholder = `例: ${selectedBrand} x The Exorcist Flannel Shirt "Black × Blue"`;
      validateStep4();
    });

    // --- Step 4 (商品名 + 翻訳 + カラー囲み) ---
    const itemNameInput = document.getElementById('itemName');
    const next4Btn = document.getElementById('next4');
    const translateMsg = document.getElementById('translateMsg');
    let typingTimer;

    const colorList = [
      "black", "white", "red", "blue", "green", "yellow", "orange", "purple", 
      "pink", "brown", "grey", "gray", "navy", "olive", "beige", "silver", 
      "gold", "khaki", "burgundy", "charcoal", "ivory", "cream", "multi", "multicolor"
    ];

    const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();

    const formatColor = (text) => {
      if (!text) return text;
      const trimmed = text.trim();
      if (trimmed.endsWith('"') || trimmed.endsWith('”') || trimmed.endsWith("'")) return text; 

      const words = trimmed.split(' ');
      if (words.length < 1) return text;

      const lastWord = words[words.length - 1];
      const cleanLast = lastWord.replace(/[^a-zA-Z]/g, '').toLowerCase();
      const isLastColor = colorList.includes(cleanLast);

      if (words.length >= 2) {
        const secondLastWord = words[words.length - 2];
        const cleanSecondLast = secondLastWord.replace(/[^a-zA-Z]/g, '').toLowerCase();
        const isSecondLastColor = colorList.includes(cleanSecondLast);

        if (isLastColor && isSecondLastColor) {
          const color1 = capitalize(cleanSecondLast);
          const color2 = capitalize(cleanLast);
          words.splice(words.length - 2, 2, `"${color1} × ${color2}"`);
          return words.join(' ') + (text.endsWith(' ') ? ' ' : '');
        }
      }
      
      if (isLastColor) {
        words[words.length - 1] = `"${lastWord}"`;
        return words.join(' ') + (text.endsWith(' ') ? ' ' : '');
      }
      return text;
    };
    
    const validateStep4 = () => {
      const selectedBrand = brandInput.value.trim();
      const currentItemName = itemNameInput.value.trim();
      next4Btn.disabled = (currentItemName === "" || currentItemName === selectedBrand);
    };

    itemNameInput.addEventListener('input', () => {
      validateStep4();
      clearTimeout(typingTimer);
      typingTimer = setTimeout(async () => {
        const text = itemNameInput.value;
        const hasJapanese = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/.test(text);
        
        if (hasJapanese) {
          translateMsg.style.display = 'block';
          translateMsg.style.color = '#007bff';
          translateMsg.textContent = '英語へ自動翻訳中...';
          next4Btn.disabled = true;
          
          try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.trim())}&langpair=ja|en`);
            const data = await res.json();
            if (data.responseData && data.responseData.translatedText) {
              itemNameInput.value = formatColor(data.responseData.translatedText);
            }
            translateMsg.style.color = '#28a745';
            translateMsg.textContent = '✓ 翻訳完了';
            setTimeout(() => { translateMsg.style.display = 'none'; }, 2000);
          } catch (error) {
            translateMsg.style.color = '#dc3545';
            translateMsg.textContent = '翻訳エラー（手動で修正してください）';
          }
        } else {
          const formattedText = formatColor(text);
          if (formattedText !== text) {
            itemNameInput.value = formattedText;
          }
        }
        validateStep4();
      }, 800);
    });

    document.getElementById('back3').addEventListener('click', () => {
      step4.classList.remove('active');
      step3.classList.add('active');
    });

    next4Btn.addEventListener('click', () => {
      step4.classList.remove('active');
      step5.classList.add('active');
    });

    // --- Step 5 (サイズ入力) ---
    const itemSizeInput = document.getElementById('itemSize');
    const next5Btn = document.getElementById('next5');

    itemSizeInput.addEventListener('input', () => {
      next5Btn.disabled = itemSizeInput.value.trim() === "";
    });

    document.getElementById('back4').addEventListener('click', () => {
      step5.classList.remove('active');
      step4.classList.add('active');
    });

    // --- Step 5 -> 6 (データ成形と遷移) ---
    next5Btn.addEventListener('click', () => {
      step5.classList.remove('active');
      step6.classList.add('active');
      
      const itemName = document.getElementById('itemName').value;
      const brand = document.getElementById('brand').value;
      const itemSize = document.getElementById('itemSize').value;
      const staff = document.getElementById('staff').value;

      // ① M列〜Q列用データ (M:商品名, N:空, O:空, P:空, Q:ブランド)
      const data1 = [itemName, "", "", "", brand];
      document.getElementById('resultData1').value = data1.join('\t');

      // ② U列〜Y列用データ (U:サイズ, V:空, W:空, X:空, Y:担当者)
      const data2 = [itemSize, "", "", "", staff];
      document.getElementById('resultData2').value = data2.join('\t');
    });

    // --- Step 6 (コピー処理) ---
    document.getElementById('back5').addEventListener('click', () => {
      step6.classList.remove('active');
      step5.classList.add('active');
    });

    const setupCopyBtn = (btnId, inputId) => {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        const textToCopy = document.getElementById(inputId).value;
        navigator.clipboard.writeText(textToCopy).then(() => {
          btn.textContent = '✓ コピー済';
          btn.style.backgroundColor = '#1e7e34';
          setTimeout(() => {
            btn.textContent = 'コピー';
            btn.style.backgroundColor = '#28a745';
          }, 2000);
        }).catch(() => {
          alert('コピーに失敗しました。');
        });
      });
    };

    setupCopyBtn('copyBtn1', 'resultData1');
    setupCopyBtn('copyBtn2', 'resultData2');
  </script>

</body>
</html>
