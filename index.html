<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>買取情報入力ツール</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #333;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .step { display: none; }
    .step.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: #555; }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
    }
    .error-text {
      color: #dc3545;
      font-size: 0.8rem;
      margin-top: 5px;
      display: none;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      color: #fff;
    }
    .btn-primary { background-color: #007bff; }
    .btn-primary:disabled { background-color: #a0cbf7; cursor: not-allowed; }
    .btn-secondary { background-color: #6c757d; }
  </style>
</head>
<body>

  <div class="container">
    <h2>買取情報入力</h2>

    <!-- Step 1: 担当者選択 -->
    <div id="step1" class="step active">
      <div class="form-group">
        <label for="staff">担当者を選択してください</label>
        <select id="staff">
          <option value="">選択してください</option>
          <option value="Aさん">Aさん</option>
          <option value="Bさん">Bさん</option>
          <option value="Cさん">Cさん</option>
        </select>
      </div>
      <div class="btn-group">
        <button id="next1" class="btn-primary" disabled>次へ</button>
      </div>
    </div>

    <!-- Step 2: IDと件数入力 -->
    <div id="step2" class="step">
      <div class="form-group">
        <label for="transactionId">取引ID</label>
        <input type="text" id="transactionId" placeholder="例: 1-123456-1">
        <div id="idError" class="error-text">形式が正しくありません (例: 1-123456-12)</div>
      </div>
      <div class="form-group">
        <label for="itemCount">件数</label>
        <input type="number" id="itemCount" min="1" placeholder="例: 1">
      </div>
      <div class="btn-group">
        <button id="back1" class="btn-secondary">戻る</button>
        <button id="next2" class="btn-primary" disabled>次へ（準備中）</button>
      </div>
    </div>

  </div>

  <script>
    // 要素の取得
    const staffSelect = document.getElementById('staff');
    const next1Btn = document.getElementById('next1');
    const transactionId = document.getElementById('transactionId');
    const itemCount = document.getElementById('itemCount');
    const next2Btn = document.getElementById('next2');
    const idError = document.getElementById('idError');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');

    // Step 1 の制御
    staffSelect.addEventListener('change', (e) => {
      next1Btn.disabled = e.target.value === "";
    });

    next1Btn.addEventListener('click', () => {
      step1.classList.remove('active');
      step2.classList.add('active');
    });

    document.getElementById('back1').addEventListener('click', () => {
      step2.classList.remove('active');
      step1.classList.add('active');
    });

    // Step 2 の制御 (IDの正規表現チェックと件数確認)
    const validateStep2 = () => {
      // (1〜2桁)-(数字のみ)-(1〜2桁)のチェック
      const idPattern = /^\d{1,2}-\d+-\d{1,2}$/;
      const idValue = transactionId.value.trim();
      const countValue = parseInt(itemCount.value, 10);

      const isIdValid = idPattern.test(idValue);
      const isCountValid = countValue > 0;

      // エラーメッセージの表示/非表示
      if (idValue !== "" && !isIdValid) {
        idError.style.display = 'block';
      } else {
        idError.style.display = 'none';
      }

      // 両方正しければ「次へ」ボタンを有効化
      next2Btn.disabled = !(isIdValid && isCountValid);
    };

    transactionId.addEventListener('input', validateStep2);
    itemCount.addEventListener('input', validateStep2);
  </script>

</body>
</html>
